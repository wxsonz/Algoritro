<!doctype html>
<html lang="en" class="tablepage">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Algoritro: a push_swap card table</title>
  <meta name="description" content="Algoritro: explore push_swap algorithms and techniques as a card game. Every number is measured.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jersey+10&display=swap">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/table.css">
  <link rel="stylesheet" href="css/tcg.css">
</head>
<body class="table-page">
  <div class="game" id="game">
    <!-- Left: the stack you are sorting, the score, and every stack to choose from. -->
    <aside class="leftpanel" aria-label="Stack and score">
      <section class="plate stackplate">
        <div id="stackChip" class="chip-stack"></div>
        <div class="stacktext">
          <div class="eyebrow" id="stackLevel">Medium stack</div>
          <b class="stackname" id="stackName">Random 100</b>
          <p class="small" id="stackDesc"></p>
        </div>
      </section>
      <section class="plate score" aria-label="Score">
        <div class="scorerow">
          <div class="moves"><div class="eyebrow">Moves</div><span id="totalShow" aria-hidden="true">–</span><span id="total" class="sr">–</span></div>
          <div id="gradeBadge" class="stampwrap"></div>
        </div>
        <p id="target" class="small dim"></p>
        <div id="mana" class="mana"></div>
        <div id="valid" class="valid small"></div>
      </section>
      <div id="delta" class="delta" aria-live="polite"></div>
      <p id="notes" class="small note"></p>
      <p id="runError" class="error" role="alert"></p>
      <section class="stacklist" aria-label="Choose a stack">
        <div class="eyebrow listhead">Pick a stack to sort</div>
        <!-- Two cheats: a "best possible on this table" line to compare your build against. -->
        <div class="cheats" role="group" aria-label="Cheats">
          <label class="cheat" title="Cheat: best card per stack&#10;Each stack sorted by whichever hand does it in the fewest moves, whatever its flag. It is the ceiling: no single push_swap reaches it."><input type="checkbox" id="cheatStack"> <span>Cheat: best card per stack</span></label>
          <label class="cheat" title="Cheat: best push_swap&#10;For each flag's seat, the hand that does best on its stacks among those that meet its class target: the best build the subject allows."><input type="checkbox" id="cheatBuild"> <span>Cheat: best push_swap</span></label>
        </div>
        <p id="cheatNote" class="small cheatnote" hidden></p>
        <p id="stackSum" class="small stacksum"></p>
        <div id="stacks" class="stacks"></div>
      </section>
    </aside>

    <!-- Centre: the play mat. Slots on top, the played card and the board, your hand below. -->
    <main class="mat" aria-label="Play mat">
      <div class="mattop">
        <div id="pathPanel" class="quest" hidden></div>
        <!-- The build: one hand per flag, and the built-in tiny seat. Click a seat to put it on the mat. -->
        <div id="buildbar" class="buildbar" role="group" aria-label="Your push_swap build"></div>
        <div id="cheatbar" class="buildbar cheatbar" role="group" aria-label="The best push_swap (cheat)" hidden></div>
      </div>
      <section class="slotbar" aria-label="Slots">
        <div class="slothead">
          <span class="eyebrow">Slots</span>
          <span id="slotInfo" class="small dim"></span>
        </div>
        <div id="slots" class="slotrow"></div>
        <div id="knobs" class="knobs"></div>
      </section>
      <section class="mid" aria-label="Played card and board">
        <div id="played" class="playedwrap"></div>
        <!-- A plain block around the board: a grid item can never bound a layout, this can. -->
        <div class="boardslot"><div class="boardplate">
          <div id="route" class="routebar" aria-live="polite"></div>
          <div id="busy" class="busy" role="status" hidden></div>
          <div id="boardWrap" class="boardwrap">
            <div id="board" class="boardbox"></div>
          </div>
          <div id="movelog" class="movelog" aria-label="Move log"></div>
          <div id="console" class="consoledock"></div>
        </div></div>
      </section>
      <section class="handzone" aria-label="Your hand">
        <div class="handhead"><span class="eyebrow">Your hand</span> <span id="handInfo" class="small dim"></span></div>
        <div id="hand" class="hand"></div>
        <!-- The two decks, beside the hand: click one to spread it out. -->
        <div class="deckdock" aria-label="Decks">
          <div class="deckspot"><div id="algoPileSpot" class="pilespot"></div><div class="pilelabel"><b>Algorithms</b><span id="algoPileInfo" class="small dim"></span></div></div>
          <div class="deckspot"><div id="techPileSpot" class="pilespot"></div><div class="pilelabel"><b>Techniques</b><span id="techPileInfo" class="small dim"></span></div></div>
        </div>
      </section>
    </main>

  </div>

  <!-- Overlays: decks spread out, and the tools. One at a time. -->
  <div class="overlay" id="ov-algo" hidden>
    <section class="sheet wide" role="dialog" aria-modal="true" aria-labelledby="algoTitle" tabindex="-1">
      <header class="sheethead">
        <h2 id="algoTitle">Algorithm deck</h2>
        <span id="familyFilter" class="chips"></span>
        <button class="close" aria-label="Close">✕</button>
      </header>
      <div class="sheetbody browsebody">
        <div class="browsegrid">
        <div id="algoViewer" class="viewer"></div>
        <h3 class="vhead">Prebuilt hands</h3>
        <p class="small dim">Named decks from the spec: click one to put it in the seat on the mat.</p>
        <div id="decksView" class="deckboxes"></div>
        <h3 class="vhead">Builds</h3>
        <p class="small dim">A hand in every seat at once: a whole push_swap.</p>
        <div id="buildsView" class="deckboxes"></div>
        </div>
        <aside id="algoPane" class="bpane" aria-live="polite"></aside>
      </div>
    </section>
  </div>

  <div class="overlay" id="ov-tech" hidden>
    <section class="sheet wide" role="dialog" aria-modal="true" aria-labelledby="techTitle" tabindex="-1">
      <header class="sheethead">
        <h2 id="techTitle">Technique deck</h2>
        <span id="techFilter" class="chips"></span>
        <button class="close" aria-label="Close">✕</button>
      </header>
      <div class="sheetbody browsebody"><div class="browsegrid"><div id="techViewer" class="viewer"></div></div><aside id="techPane" class="bpane" aria-live="polite"></aside></div>
    </section>
  </div>

  <div class="overlay" id="ov-input" hidden>
    <section class="sheet" role="dialog" aria-modal="true" aria-labelledby="inputTitle" tabindex="-1">
      <header class="sheethead"><h2 id="inputTitle">Custom input</h2><button class="close" aria-label="Close">✕</button></header>
      <div class="sheetbody">
        <div class="row">
          <label>how many <input id="n" type="number" min="0" max="1000" value="100"></label>
          <span class="quick" id="quick"></span>
        </div>
        <div class="row">
          <label>shape <select id="gen"></select></label>
          <label id="paramWrap"><span id="paramName">k</span> <input id="param" type="number" step="any"></label>
          <label>seed <input id="seed" type="number" value="1000"></label>
          <button id="reroll" class="ghost" title="New random seed" aria-label="New random seed">⟳ reshuffle</button>
        </div>
        <div class="row">
          <label class="grow">your own numbers <input id="manual" type="text" placeholder="e.g. 2 1 3 6 5 8 (overrides the shape)"></label>
        </div>
        <p id="inputError" class="error" role="alert"></p>
        <p id="inputInfo" class="small"></p>
        <p id="rankView" class="dim mono small"></p>
      </div>
    </section>
  </div>

  <div class="overlay" id="ov-inspect" hidden>
    <section class="sheet inspect" role="dialog" aria-modal="true" aria-labelledby="inspectTitle" tabindex="-1">
      <header class="sheethead"><h2 id="inspectTitle">Card</h2><button class="close" aria-label="Close">✕</button></header>
      <div class="sheetbody"><div id="inspectBody" class="inspectbody"></div></div>
    </section>
  </div>

  <script type="module" src="js/ui/table.js"></script>
</body>
</html>
